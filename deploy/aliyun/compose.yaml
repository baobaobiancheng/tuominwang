name: tuominwang-aliyun
x-runtime: &runtime
  image: tuominwang-runtime:aliyun-20261013
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=128m,mode=1777"]
  volumes: [materials:/data, "./models:/models:ro"]
  networks: [private]
  environment: &runtime-env
    DATABASE_URL: postgresql://tmw_app:${APP_DB_PASSWORD:?Set app DB password}@db:5432/tuominwang
    DATA_KEY: ${DATA_KEY:?Set data key}
    SESSION_KEY: ${SESSION_KEY:?Set session key}
    APP_ORIGIN: https://182.92.172.59
    APP_BASE_PATH: /tuomin/
    DOWNLOAD_TTL_SECONDS: "300"
    NER_ENABLED: "1"
    TRUST_PROXY: "1"
  depends_on: { db: { condition: service_healthy } }
services:
  db:
    # Existing, verified amd64 PostgreSQL 17.9 image; this service uses its own volume/database.
    image: docker.m.daocloud.io/paradedb/paradedb@sha256:cb2af8cbafea8c41cde450b7be845abfd74c014cb13e35e06677aad8aed0eba0
    pull_policy: never
    restart: unless-stopped
    environment: { POSTGRES_USER: tmw_owner, POSTGRES_DB: tuominwang, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set database owner password}" }
    volumes: [database:/var/lib/postgresql/data]
    networks: [private]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U tmw_owner -d tuominwang"], interval: 3s, timeout: 3s, retries: 20 }
  api:
    <<: *runtime
    command: [node, scripts/check-runtime.ts, api]
    healthcheck: { test: [CMD, node, -e, "fetch('http://127.0.0.1:4318/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 20s, timeout: 5s, retries: 15 }
  worker:
    <<: *runtime
    command: [node, scripts/check-runtime.ts, worker]
  web:
    image: tuominwang-web:aliyun-20261013-session-sync
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    ports: ["127.0.0.1:5189:8080"]
    networks:
      private:
      ingress: { aliases: [tuominwang-web] }
    depends_on: { api: { condition: service_healthy } }
    healthcheck: { test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/"], interval: 10s, timeout: 3s, retries: 10 }
  migrate:
    <<: *runtime
    profiles: [maintenance]
    restart: "no"
    command: [node, scripts/migrate.ts]
    environment:
      MIGRATION_DATABASE_URL: postgresql://tmw_owner:${POSTGRES_PASSWORD}@db:5432/tuominwang
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
  admin:
    <<: *runtime
    profiles: [maintenance]
    restart: "no"
    command: [node, scripts/admin.ts]
    environment:
      MIGRATION_DATABASE_URL: postgresql://tmw_owner:${POSTGRES_PASSWORD}@db:5432/tuominwang
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set initial account name}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set initial account password}
networks:
  private: { internal: true }
  ingress: { name: tuominwang-ingress }
volumes:
  database:
  materials:
